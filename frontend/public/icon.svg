<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A884"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="handGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer Iris / Camera Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="160" fill="rgba(15,23,42,0.6)" stroke="#00F59B" stroke-width="4"/>
  
  <!-- Sign Language Hand Icon (Stylized Victory / Bridge Hand) -->
  <g filter="url(#shadow)" fill="url(#handGlow)">
    <!-- Palm base -->
    <path d="M210 240 C210 220, 230 200, 256 200 C282 200, 302 220, 302 240 L302 310 C302 340, 280 370, 256 370 C232 370, 210 340, 210 310 Z"/>
    
    <!-- Index Finger -->
    <rect x="225" y="130" width="26" height="110" rx="13" />
    
    <!-- Middle Finger -->
    <rect x="261" y="110" width="26" height="130" rx="13" />
    
    <!-- Thumb (spread outward) -->
    <path d="M215 260 L165 230 C155 224, 142 230, 142 245 C142 255, 148 265, 160 272 L215 305 Z"/>
    
    <!-- Optical Sensor Dot -->
    <circle cx="256" cy="270" r="14" fill="#FFFFFF"/>
    <circle cx="256" cy="270" r="7" fill="#0284C7"/>
  </g>
</svg>
