version: '3.8'

services:
  signvision:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signvision-app
    ports:
      - "5000:5000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_PRIMARY_MODEL=google/gemma-4-31b-it:free
    restart: unless-stopped
